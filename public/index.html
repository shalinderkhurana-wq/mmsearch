<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEDIMANCH Viral Territory Explorer — Prototype</title>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--ink:#17191c;--muted:#69717c;--line:#e2e5e9;--accent:#111;--chip:#f0f2f4;--hot:#fff0d6;--green:#e9f7ee}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{height:64px;background:#111;color:#fff;display:flex;align-items:center;padding:0 22px;gap:16px}
.logo{font-weight:800;letter-spacing:.5px}.sub{opacity:.65;font-size:12px}
.layout{display:grid;grid-template-columns:290px 1fr 310px;height:calc(100vh - 64px)}
aside,.right{background:var(--panel);overflow:auto}.left{border-right:1px solid var(--line);padding:16px}.right{border-left:1px solid var(--line);padding:16px}
.main{padding:20px 24px;overflow:auto}
.search{display:flex;gap:8px;margin-bottom:16px}.search input{flex:1;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:14px}.btn{border:0;border-radius:9px;padding:10px 13px;cursor:pointer;background:#111;color:#fff;font-weight:700}.btn.secondary{background:var(--chip);color:#222}.btn.small{padding:7px 9px;font-size:12px}
.section-title{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:16px 0 8px}
.tree button{width:100%;text-align:left;border:0;background:transparent;padding:9px 8px;border-radius:8px;cursor:pointer;color:#222}.tree button:hover,.tree button.active{background:#eef0f2}.tree .indent{padding-left:24px}.tree .indent2{padding-left:42px}
.crumb{font-size:12px;color:var(--muted);margin-bottom:14px}.crumb span{cursor:pointer;color:#333}.crumb span:hover{text-decoration:underline}
h1{font-size:26px;margin:4px 0 7px}.desc{color:var(--muted);font-size:14px;max-width:760px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:20px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;cursor:pointer}.card:hover{border-color:#aaa;box-shadow:0 4px 14px #0000000a}.card h3{margin:0 0 7px;font-size:15px}.meta{font-size:12px;color:var(--muted);line-height:1.55}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.badge{font-size:10px;padding:4px 7px;border-radius:99px;background:var(--chip)}.hot{background:var(--hot)}.fit{background:var(--green)}
.toolbar{display:flex;gap:8px;align-items:center;margin:18px 0}.toolbar .spacer{flex:1}
.angle{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}.angle strong{font-size:13px}.titles{margin-top:8px;padding-left:18px}.titles li{margin:7px 0;font-size:13px}
.save{float:right}.saved-item{padding:10px;border-bottom:1px solid var(--line);font-size:12px}.empty{color:var(--muted);font-size:13px;padding:12px 0}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}.kpi div{background:var(--chip);border-radius:9px;padding:10px}.kpi b{display:block;font-size:17px}.kpi span{font-size:10px;color:var(--muted)}
.notice{background:#f7f7f7;border:1px dashed #cfd3d7;border-radius:10px;padding:11px;font-size:12px;color:#59616b;margin-top:14px}
@media(max-width:1000px){.layout{grid-template-columns:230px 1fr}.right{display:none}}
</style>
</head>
<body>
<header><div class="logo">MEDIMANCH</div><div class="sub">VIRAL TERRITORY EXPLORER · LIVE SIGNAL V1</div></header>
<div class="layout">
<aside class="left">
  <div class="search"><input id="kw" placeholder="Enter: gut, liver, sleep..."><button class="btn small" onclick="discover()">Go</button></div>
  <div class="section-title">Main Keywords</div>
  <div id="tree" class="tree"></div>
  <div class="section-title">Navigation</div>
  <button class="btn secondary small" onclick="goHome()">⌂ Home</button>
  <button class="btn secondary small" style="margin-top:6px" onclick="showSaved()">★ Saved Shortlist</button>
</aside>
<main class="main">
  <div id="content"></div>
</main>
<aside class="right">
  <div class="section-title">Current Path</div><div id="pathbox" class="meta">Home</div>
  <div class="section-title">Saved Shortlist</div>
  <div id="saved"></div>
  <div class="notice">LIVE ENGINE: the selected territory is sent to the backend for current-source discovery. Preloaded hierarchy is navigation only; scan results come from /api/scan.</div>
</aside>
</div>
<script>
/*
  MEDIMANCH V1 REAL SIGNAL API
  ----------------------------------
  To connect a real backend later, replace localSignalEngine(ctx) with:

    const response = await fetch("/api/scan", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(ctx)
    });
    return await response.json();

  Expected response:
  {
    signalStrength,
    peopleQuestions: [],
    discussions: [],
    behaviours: [],
    bic: {primary, connected, relationship},
    angles: [[type, title], ...],
    sourceStatus
  }
*/

const DATA={
Gut:{desc:"Large human wellness flagship. Explore only the territories with enough cluster density to justify deeper research.",children:{
  Microbiome:{children:{
    "Fermented Foods":{children:{
      "Fermented Rice":{signal:"RISING",density:"VERY HIGH",angles:[
        ["Transformation","What actually changes when rice is fermented?","Raat bhar rakhe chawal mein subah tak kya badal jaata hai?","Fresh rice vs fermented rice: body ke liye kya badalta hai?"],
        ["Traditional Practice","Why was fermented rice used traditionally?","Dadi ka fermented rice: sirf parampara ya kuch science bhi?"],
        ["Myth / Reality","Are all leftover rice preparations 'probiotic'?","Basi chawal aur fermented rice — kya dono same hain?"],
        ["Body Mechanism","What happens during fermentation?","Chawal ferment hone par starch ke saath actually kya hota hai?"]
      ]},
      "Curd / Yogurt":{signal:"HIGH",density:"VERY HIGH",angles:[["Comparison","Curd vs probiotic products","Ghar ka dahi vs probiotic drink: difference kya hai?"]]}}
    },
    "Probiotics":{signal:"HIGH",density:"VERY HIGH",angles:[["Myth / Reality","Do probiotic foods always improve gut health?","Har probiotic food gut ke liye useful hota hai kya?"]]},
    "Prebiotics":{signal:"RISING",density:"HIGH",angles:[["Food Behaviour","Which Indian foods naturally feed gut bacteria?","Gut bacteria ko khana kaun deta hai? Indian plate mein kya hai?"]]}
  }},
  "Gut Motility":{signal:"HIGH",density:"VERY HIGH",angles:[["Body Mechanism","How food actually moves through the gut","Khana pet se body ke bahar tak kitne time mein pahuchta hai?"]]},
  "Bowel Movement":{signal:"HIGH",density:"VERY HIGH",angles:[["Human Problem","Why do some people feel incomplete evacuation?","Pet saaf hone ke baad bhi 'poora saaf nahi hua' kyun lagta hai?"]]},
  "Food Sequencing":{signal:"RISING",density:"HIGH",angles:[["Experiment","Does eating order change the body's response?","Sabzi, protein ya roti — khane ka order sach mein matter karta hai?"]]}
}},
Liver:{desc:"Flagship for liver function, metabolic health and traditional/modern wellness questions.",children:{
  "Bile & Digestion":{children:{
    "Bile Flow":{signal:"EMERGING",density:"HIGH",angles:[["Body Mechanism","What bile actually does after a meal","Fat khane ke baad body mein bile actually kya karti hai?"]]},
    "Gallbladder":{signal:"HIGH",density:"HIGH",angles:[["Human Question","Why does the gallbladder matter for digestion?","Gallbladder sirf 'stone' ke liye hota hai ya digestion mein bhi role hai?"]]}
  }},
  "Fatty Liver":{signal:"HIGH",density:"VERY HIGH",angles:[["Hidden Mechanism","How can fatty liver develop without obvious symptoms?","Fatty liver mein liver ke andar actually kya change hota hai?"]]},
  "Liver Tests":{signal:"RISING",density:"VERY HIGH",angles:[["Clarity","What do common liver tests actually tell you?","Liver ke common tests mein kaunsa number kya batata hai?"]]}
}},
Sleep:{desc:"Flagship covering sleep behaviour, circadian biology, recovery and practical routines.",children:{
  "Circadian Rhythm":{children:{
    "Morning Light":{signal:"RISING",density:"HIGH",angles:[["Behaviour","Why morning light matters for body timing","Subah ki sunlight body clock ko signal kaise deti hai?"]]},
    "Sleep Timing":{signal:"HIGH",density:"VERY HIGH",angles:[["Comparison","Same hours, different timing — does it matter?","8 ghante ki sleep: timing matter karti hai kya?"]]}
  }},
  "Night Waking":{signal:"HIGH",density:"VERY HIGH",angles:[["Human Problem","Why people wake repeatedly at night","Raat ko baar-baar aankh khulna — body mein kya ho raha hai?"]]},
  "Sleep Practices":{signal:"RISING",density:"HIGH",angles:[["Experiment","Which bedtime behaviours are actually plausible?","Sone se pehle ki 5 popular practices: kaunsi logic samajh aati hai?"]]}
}}};

let current=[], currentNode=null, saved=JSON.parse(localStorage.getItem("mm_saved")||"[]");

function nodeChildren(n){return n&&n.children?n.children:{}}
function renderTree(){
 const el=document.getElementById("tree"); el.innerHTML="";
 Object.entries(DATA).forEach(([k,v])=>{
  const b=document.createElement("button"); b.textContent="▸ "+k; b.onclick=()=>openNode([k],v); el.appendChild(b);
 });
}
function pathHTML(){
 return current.length?current.map((x,i)=>`<span onclick="jump(${i})">${x}</span>`).join("  ›  "):"Home";
}
function jump(i){let p=current.slice(0,i+1);let n=DATA[p[0]];for(let j=1;j<p.length;j++)n=n.children[p[j]];openNode(p,n)}
function openNode(path,n){
 current=path;currentNode=n;
 document.getElementById("pathbox").innerHTML=pathHTML();
 if(!path.length){goHome();return}
 let html=`<div class="crumb">${pathHTML()}</div><h1>${path[path.length-1]}</h1><div class="desc">${n.desc||"Explore this node, then drill down only where cluster density and signal justify deeper research."}</div>`;
 if(n.signal||n.density){
   html+=`<div class="kpi"><div><b>${n.signal||"—"}</b><span>CURRENT SIGNAL</span></div><div><b>${n.density||"—"}</b><span>CLUSTER DENSITY</span></div></div>`;
 }
 if(n.children){
  html+=`<div class="toolbar"><b>Next layer</b><span class="spacer"></span><button class="btn small" onclick="scanNode()">🔥 Scan this node</button></div><div class="cards">`;
  Object.entries(n.children).forEach(([k,v])=>html+=`<div class="card" onclick='openNode(${JSON.stringify(path.concat(k))},currentNode.children[${JSON.stringify(k)}])'><h3>${k}</h3><div class="meta">${v.signal?"Signal: "+v.signal:"Explore sub-category"} ${v.density?" · Density: "+v.density:""}</div>${v.signal?`<div class="badges"><span class="badge hot">${v.signal}</span><span class="badge fit">${v.density||"MAPPED"}</span></div>`:""}</div>`);
  html+="</div>";
 } else if(n.angles){
  html+=`<div class="toolbar"><b>Viral angles</b><span class="spacer"></span><button class="btn small" onclick="saveCurrent()">★ Save cluster</button></div>`;
  n.angles.forEach((a,i)=>{html+=`<div class="angle"><button class="btn secondary small save" onclick="saveAngle(${i})">★</button><strong>${i+1}. ${a[0]}</strong><div class="meta" style="margin-top:5px">${a[1]}</div><ol class="titles">`+a.slice(2).map(t=>`<li>${t}</li>`).join("")+`</ol></div>`});
  html+=`<div class="notice">Next production step: run live signal research on this cluster before selecting the final title. The prototype currently shows example angles only.</div>`;
 }
 document.getElementById("content").innerHTML=html; renderSaved();
}
function goHome(){current=[];currentNode=null;document.getElementById("pathbox").textContent="Home";document.getElementById("content").innerHTML=`<h1>Choose a main keyword</h1><div class="desc">Click a flagship, then drill down. Your path stays visible and saved items remain on the right.</div><div class="cards">`+Object.entries(DATA).map(([k,v])=>`<div class="card" onclick='openNode(${JSON.stringify([k])},DATA[${JSON.stringify(k)}])'><h3>${k}</h3><div class="meta">${v.desc}</div></div>`).join("")+"</div>";renderSaved()}
function discover(){let q=document.getElementById("kw").value.trim().toLowerCase();let key=Object.keys(DATA).find(k=>k.toLowerCase()==q||k.toLowerCase().includes(q));if(key)openNode([key],DATA[key]);else document.getElementById("content").innerHTML=`<h1>${q||"Keyword"}</h1><div class="notice">No preloaded prototype map for this keyword. In the production version this action will run the Main Keyword Navigator and build the hierarchy from live research.</div>`}
async function scanNode(){
  if(!current.length) return;
  const scanBtn = document.querySelector('.toolbar .btn');
  if(scanBtn){ scanBtn.disabled=true; scanBtn.textContent="⏳ Scanning..."; }

  const path = current.slice();
  const nodeName = path[path.length-1];

  // Live backend scan. No local demo fallback.
  try {
    const result = await localSignalEngine({
      path,
      node: nodeName,
      keyword: path[0]
    });
    renderLiveScan(result);
  } catch(err) {
    document.getElementById("content").innerHTML = `
      <h1>⚠ Live Scan Error</h1>
      <div class="notice">${esc(err.message || "Could not reach the signal engine.")}</div>
      <div class="toolbar"><button class="btn small" onclick="openNode(current,currentNode)">↻ Back to territory</button></div>`;
  } finally {
    if(scanBtn){ scanBtn.disabled=false; scanBtn.textContent="🔥 Scan live signals"; }
  }
}


function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

async function localSignalEngine(ctx){
  const response = await fetch("/api/scan", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(ctx)
  });
  if(!response.ok){
    const msg = await response.text();
    throw new Error(msg || "Signal API failed");
  }
  return await response.json();
}

function renderLiveScan(r){
  const html = `
    <div class="crumb">${r.path.map((x,i)=>`<span onclick="jump(${i})">${esc(x)}</span>`).join(" › ")}</div>
    <h1>🔥 Live Signal Scan</h1>
    <div class="desc">
      <b>${esc(r.node)}</b> — signal workspace. The navigation path is preserved while the signal layer is explored.
    </div>

    <div class="kpi">
      <div><b>${esc(r.signalStrength)}</b><span>SIGNAL STRENGTH</span></div>
      <div><b>${esc(r.bic.primary)}</b><span>PRIMARY BIC</span></div>
    </div>

    <div class="notice"><b>${esc(r.sourceStatus || "LIVE SOURCE SCAN")}</b><br>Sources: ${(r.sources||[]).map(s=>esc(s)).join(" · ")}<br>Scanned: ${esc(r.timestamp || "")}<br>
      This Live source scan. Every source is labeled and timestamps are shown. Signal strength is a derived heuristic, not a search-volume claim.
    </div>

    <div class="toolbar"><b>People Questions</b><span class="spacer"></span></div>
    ${r.peopleQuestions.map((x,i)=>`<div class="angle"><strong>${i+1}. ${esc(x)}</strong></div>`).join("")}

    <div class="toolbar"><b>Discussion / Curiosity Signals</b><span class="spacer"></span></div>
    ${r.discussions.map(x=>`<div class="angle"><div class="meta">${esc(x)}</div></div>`).join("")}

    <div class="toolbar"><b>Observed Behaviour Buckets</b><span class="spacer"></span></div>
    <div class="badges">${r.behaviours.map(x=>`<span class="badge">${esc(x)}</span>`).join("")}</div>

    <div class="toolbar"><b>BIC Ecosystem Connection</b><span class="spacer"></span></div>
    <div class="angle">
      <strong>${esc(r.bic.primary)}</strong>
      <div class="meta">Relationship: ${esc(r.bic.relationship)}</div>
      ${r.bic.connected.length ? `<div class="badges">${r.bic.connected.map(x=>`<span class="badge fit">${esc(x)}</span>`).join("")}</div>` : ""}
    </div>

    <div class="toolbar"><b>Potential MEDIMANCH Angles</b><span class="spacer"></span></div>
    ${r.angles.map((a,i)=>`
      <div class="angle">
        <button class="btn secondary small save" onclick="save({type:'live-angle',path:${JSON.stringify(r.path.join(" › "))},angle:${JSON.stringify(a[0])},title:${JSON.stringify(a[1])}})">★</button>
        <strong>${i+1}. ${esc(a[0])}</strong>
        <div class="meta" style="margin-top:5px">${esc(a[1])}</div>
      </div>`).join("")}

    <div class="notice">Next connection point: replace <b>localSignalEngine()</b> with a backend API. The UI contract can remain unchanged.</div>
  `;
  document.getElementById("content").innerHTML=html;
  renderSaved();
}

function saveCurrent(){if(!current.length)return;save({type:"cluster",path:current.join(" › ")});}
function saveAngle(i){save({type:"angle",path:current.join(" › "),angle:currentNode.angles[i][0],title:currentNode.angles[i].slice(2).join(" / ")});}
function save(x){saved=saved.filter(y=>JSON.stringify(y)!==JSON.stringify(x));saved.unshift(x);localStorage.setItem("mm_saved",JSON.stringify(saved));renderSaved()}
function renderSaved(){let e=document.getElementById("saved");if(!saved.length){e.innerHTML='<div class="empty">Nothing saved yet.</div>';return}e.innerHTML=saved.slice(0,12).map((x,i)=>`<div class="saved-item"><b>${x.type==="cluster"?"★ ":"★ "}${x.path}</b>${x.angle?`<br>${x.angle}: ${x.title}`:""}<button class="btn secondary small" style="float:right" onclick="removeSaved(${i})">×</button></div>`).join("")}
function removeSaved(i){saved.splice(i,1);localStorage.setItem("mm_saved",JSON.stringify(saved));renderSaved()}
function showSaved(){document.getElementById("content").innerHTML='<h1>Saved Shortlist</h1><div class="desc">Your saved territories, clusters and angles.</div>'+saved.map(x=>`<div class="angle"><b>${x.path}</b>${x.angle?`<div class="meta">${x.angle} — ${x.title}</div>`:""}</div>`).join("")}
renderTree();goHome();
</script>
</body>
</html>
