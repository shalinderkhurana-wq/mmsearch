<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MEDIMANCH Research Navigator V5.2</title>
<style>
:root{--bg:#f4f2ec;--panel:#fffefa;--panel2:#eeece5;--line:#d9d5ca;--text:#22252a;--muted:#6c7076;--yellow:#d9aa00;--yellow2:#fff2b8;--teal:#0d7f78;--teal2:#d9f1ee;--blue:#315f9a;--blue2:#e5edf9;--red:#b53b3b;--red2:#fde9e9;--green:#2e7d4f;--green2:#e4f3e8;--shadow:0 4px 18px rgba(35,35,35,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial,sans-serif;font-size:14px}.top{min-height:72px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 18px;position:sticky;top:0;z-index:20}.logo{font-weight:900;letter-spacing:.09em}.badge{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:4px 8px;color:var(--muted);font-weight:800}.search{display:flex;gap:8px;flex:1;max-width:720px;margin-left:10px}.search input{flex:1;min-width:160px;padding:11px 13px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--text);outline:none}.search input:focus{border-color:var(--yellow)}button{font:inherit;cursor:pointer}.btn{border:1px solid var(--line);background:#fff;padding:9px 11px;border-radius:7px;color:var(--text);font-weight:700}.btn:hover{background:var(--panel2)}.primary{background:var(--yellow);border-color:#c99d00}.primary:hover{background:#e3b300}.teal{background:var(--teal2);border-color:#a9d8d3;color:#075d58}.green{background:var(--green2);border-color:#b8ddc2;color:#23623d}.danger{background:var(--red2);border-color:#efbcbc;color:#8f2828}.health{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}.app{display:grid;grid-template-columns:270px minmax(0,1fr) 270px;min-height:calc(100vh - 72px)}aside{background:var(--panel);padding:15px;border-right:1px solid var(--line);overflow:auto}.right{border-left:1px solid var(--line);border-right:0}.side h3,.right h3{font-size:11px;letter-spacing:.12em;color:var(--muted);margin:2px 0 12px}.center{padding:20px;min-width:0}.crumb{color:var(--muted);font-size:12px;margin-bottom:14px}.crumb b{color:var(--text)}.hero{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:18px;display:flex;justify-content:space-between;gap:20px;box-shadow:var(--shadow)}h1{font-size:25px;line-height:1.15;margin:6px 0 7px}.hero p{margin:0;color:var(--muted);max-width:760px;line-height:1.5}.node-type{text-transform:uppercase;font-size:10px;letter-spacing:.12em;color:var(--teal);font-weight:900}.actions{display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;justify-content:flex-end}.actions button:disabled,.search button:disabled{opacity:.55;cursor:not-allowed}.tree{font-size:12px}.tree button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 6px;border-radius:6px;color:var(--text)}.tree button:hover{background:var(--panel2)}.tree .root{font-weight:900;background:var(--yellow2)}.children{margin-left:13px;border-left:1px solid var(--line);padding-left:7px}.tree .territory{font-weight:800}.tree .sub{font-weight:700;color:#45494f}.tree .hub{color:var(--teal);font-weight:800}.tree .cluster{color:#4c5360}.empty{border:1px dashed var(--line);background:rgba(255,254,250,.5);padding:34px 20px;text-align:center;color:var(--muted);border-radius:10px;margin-top:16px;line-height:1.55}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:15px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:var(--shadow)}.card.full{grid-column:1/-1}.card h2{font-size:11px;letter-spacing:.1em;margin:0 0 11px;color:var(--muted)}.item{padding:10px 0;border-bottom:1px solid #e8e5dd;line-height:1.45}.item:last-child{border-bottom:0}.title{font-size:15px;font-weight:850}.signal{color:#555b63;margin-top:4px}.small{font-size:11px;color:var(--muted)}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:2px 7px;font-size:10px;color:var(--muted);margin:3px 4px 0 0;background:#faf9f5}.pathbox{background:var(--panel2);border:1px solid var(--line);padding:10px;border-radius:8px;line-height:1.6;margin-bottom:16px}.saved{display:flex;justify-content:space-between;gap:6px;border-bottom:1px solid var(--line);padding:9px 0}.saved button{background:none;border:0;color:var(--text);text-align:left;padding:0}.saved .x{color:var(--muted);font-weight:900}.notice{padding:10px 12px;border:1px solid #e1c95d;background:#fff8d7;color:#5e5000;border-radius:8px;margin:12px 0}.notice.err{border-color:#efbcbc;background:var(--red2);color:#8f2828}.mechanism{background:var(--teal2);border:1px solid #b8dfda;border-radius:9px;padding:13px}.mechanism .name{font-size:18px;font-weight:900;color:#075d58}.ipbox{background:var(--blue2);border:1px solid #c5d5ec;border-radius:9px;padding:14px}.radarHeader{display:flex;justify-content:space-between;align-items:center;gap:10px}.radarControls{display:flex;gap:8px;flex-wrap:wrap}.radarGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.radarCloud{display:flex;flex-wrap:wrap;gap:7px;align-items:center;padding:15px;background:#faf9f5;border:1px solid var(--line);border-radius:10px;margin-top:12px}.cloudChip{border:1px solid #d8d4c8;background:#fff;border-radius:999px;padding:7px 10px;cursor:pointer;font-weight:800;line-height:1.1;transition:.12s}.cloudChip:hover{background:var(--yellow2);transform:translateY(-1px)}.cloudChip .score{font-size:9px;color:var(--muted);margin-left:5px;font-weight:700}.radarStrong{margin-top:15px}.signalScore{display:inline-block;border:1px solid #d9d4c7;background:#faf9f5;border-radius:999px;padding:2px 7px;font-size:10px;font-weight:900}.radarCount{font-size:12px;color:var(--muted);margin-top:6px}.radarItem{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:13px;box-shadow:var(--shadow)}.radarItem .kw{font-size:17px;font-weight:900}.why{margin-top:6px;color:#555b63;line-height:1.45}.sourceLine{font-size:10px;color:var(--muted);margin-top:8px}.raw{max-height:280px;overflow:auto}.raw div{padding:7px 0;border-bottom:1px solid var(--line);font-size:11px}.modePill{font-size:10px;font-weight:800;border:1px solid var(--line);padding:4px 7px;border-radius:999px;background:var(--panel2)}.hide{display:none!important}.toolbar{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.sectionNote{color:var(--muted);font-size:12px;line-height:1.5;margin:0 0 12px}.ipAsset{padding:9px 0;border-bottom:1px solid #d9e1ee}.ipAsset:last-child{border-bottom:0}.ipAsset b{font-size:12px}.ipAsset span{display:inline-block;margin-left:5px}.footerNote{font-size:10px;color:var(--muted);margin-top:16px}
@media(max-width:1150px){.app{grid-template-columns:230px minmax(0,1fr)}.right{display:none}}@media(max-width:760px){.top{flex-wrap:wrap}.search{order:4;width:100%;max-width:none;margin:0}.app{display:block}.side{display:none}.center{padding:13px}.grid,.radarGrid{grid-template-columns:1fr}.hero{display:block}.actions{justify-content:flex-start;margin-top:12px}.health{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="logo">MEDIMANCH</div><span class="badge">RESEARCH NAVIGATOR V5.7</span>
  <div class="search"><input id="keyword" placeholder="My keyword: Gut Health, Kidney, Tai Chi, Omega-3…"/><button class="btn primary" onclick="buildMap()">EXPLORE MY KEYWORD</button></div>
  <button class="btn teal" onclick="openRadar()">🔥 SIGNAL RADAR</button>
  <div class="health" id="health">checking…</div>
</header>
<div class="app">
  <aside class="side"><h3>RESEARCH MAP</h3><div id="tree"><div class="empty">Choose <b>My Keyword</b> or <b>Signal Radar</b> to start.</div></div></aside>
  <main class="center"><div id="crumb" class="crumb">Home</div><div id="main"></div></main>
  <aside class="right"><h3>CURRENT PATH</h3><div id="path" class="pathbox">Home</div><h3>SAVED RESEARCH</h3><div id="saved"></div><h3 style="margin-top:20px">SAVED CONTENT IP</h3><div id="savedIP"></div></aside>
</div>
<script>
const state={map:null,node:null,result:null,radar:null,radarHistory:JSON.parse(localStorage.getItem('mm_radar_history_v56')||'[]'),saved:JSON.parse(localStorage.getItem('mm_saved_v5')||'[]'),savedIP:JSON.parse(localStorage.getItem('mm_saved_ip_v5')||'[]'),busy:false};
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function persist(){localStorage.setItem('mm_saved_v5',JSON.stringify(state.saved));localStorage.setItem('mm_saved_ip_v5',JSON.stringify(state.savedIP));renderSaved()}
function renderSaved(){
 $('saved').innerHTML=state.saved.length?state.saved.map((x,i)=>`<div class="saved"><button onclick="selectSaved(${i})">${esc((x.path||[]).join(' › '))}</button><button class="x" onclick="removeSaved(${i})">×</button></div>`).join(''):'<div class="small">Nothing saved yet.</div>';
 $('savedIP').innerHTML=state.savedIP.length?state.savedIP.map((x,i)=>`<div class="saved"><button onclick="showIPSaved(${i})">${esc(x.hubName||'Content IP Hub')}</button><button class="x" onclick="removeIP(${i})">×</button></div>`).join(''):'<div class="small">No Content IP explored yet.</div>';
}
function removeSaved(i){state.saved.splice(i,1);persist()} function removeIP(i){state.savedIP.splice(i,1);persist()}
function selectSaved(i){const x=state.saved[i];if(x)selectNode(x.node)}
function showIPSaved(i){const x=state.savedIP[i];if(x){state.node=x.node;state.result=x.research;renderMain();}}
function setBusy(b,msg=''){state.busy=b;document.querySelectorAll('button').forEach(x=>x.disabled=b);if(msg)notice(msg)}
function notice(msg,err=false){let x=document.querySelector('.notice');if(!x){x=document.createElement('div');x.className='notice';$('main').prepend(x)}x.className='notice'+(err?' err':'');x.textContent=msg}
function clearNotice(){document.querySelector('.notice')?.remove()}
function nodePath(n){return n.path||[state.map?.keyword||'',n.label||'']}
function selectNode(n){state.node=n;state.result=null;$('crumb').innerHTML=nodePath(n).map((x,i)=>i?` <span>›</span> <b>${esc(x)}</b>`:`<b>${esc(x)}</b>`).join('');$('path').textContent=nodePath(n).join(' › ');renderMain()}
function saveNode(){if(!state.node)return;const k=JSON.stringify(state.node.path);if(!state.saved.some(x=>JSON.stringify(x.node.path)===k)){state.saved.unshift({node:state.node,path:state.node.path});state.saved=state.saved.slice(0,150);persist();notice('Saved to research shortlist.')}}
function renderTreeNode(n,parentPath,type){
 const children=n.children||[];const node={id:n.id||crypto.randomUUID(),label:n.label||'Unnamed',type,path:[...parentPath,n.label||''],children,mechanism:n.mechanism||''};
 const cls=type==='territory'?'territory':type==='sub'?'sub':type==='hub'?'hub':'cluster';
 const icon=type==='territory'?'▸':type==='hub'?'◆':'•';
 return `<div><button class="${cls}" onclick='selectNode(${JSON.stringify(node)})'>${icon} ${esc(n.label)}</button>${children.length?`<div class="children">${children.map(c=>renderTreeNode(c,node.path,type==='territory'?'sub':type==='sub'?'hub':'cluster')).join('')}</div>`:''}</div>`;
}
function renderTree(){if(!state.map)return;const root={id:'root',label:state.map.keyword,type:'flagship',path:[state.map.keyword],children:state.map.territories||[]};$('tree').innerHTML=`<button class="root" onclick='selectNode(${JSON.stringify(root)})'>⭐ ${esc(state.map.keyword)}</button><div class="children">${(state.map.territories||[]).map(t=>renderTreeNode(t,[state.map.keyword],'territory')).join('')}</div>`}
async function buildMap(){const keyword=$('keyword').value.trim();if(!keyword)return;setBusy(true,'Building the research universe from your keyword…');try{const r=await fetch('/api/map',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({keyword})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Map error');state.map=j.map;renderTree();selectNode({id:'root',label:j.map.keyword,type:'flagship',path:[j.map.keyword],children:j.map.territories||[]});localStorage.setItem('mm_map_v5_'+keyword.toLowerCase(),JSON.stringify(j.map));if(j.mode==='fallback')notice('LLM map fallback was used: '+(j.warning||'unknown reason'));else clearNotice()}catch(e){notice(e.message,true)}finally{setBusy(false)}}
function renderMain(){const n=state.node;if(!n){$('main').innerHTML=`<div class="empty">Start with <b>My Keyword</b> or <b>Signal Radar</b>.</div>`;return}const can=n.type!=='flagship';let body=state.result?renderResult(state.result):`<div class="empty">${can?'This node is selected. Live research starts only when you click <b>Research This Node</b>.':'This is the flagship map. Select a Territory, Sub-category, Core Concept/Mechanism or Cluster to research it.'}</div>`;$('main').innerHTML=`<section class="hero"><div><div class="node-type">${esc(n.type)}</div><h1>${esc(n.label)}</h1><p>${esc(n.description||'Selected node. The map is stable; live signals are refreshed separately.')}</p></div><div class="actions">${can?`<button class="btn primary" onclick="research('research')">Research This Node</button><button class="btn green" onclick="research('deeper')">Go Deeper</button><button class="btn" onclick="research('redo')">Research Again</button>`:''}</div></section>${can?`<div class="toolbar"><button class="btn" onclick="saveNode()">☆ Save Research Node</button>${state.result?`<button class="btn teal" onclick="exploreIP()">＋ Explore as Content IP</button>`:''}</div>`:''}${body}`}
function arr(a){return Array.isArray(a)?a:[]}
function renderResult(r){
 const mech=r.mechanism||{};
 return `<div class="grid">
 ${mech.name||mech.simpleExplanation?`<section class="card full"><h2>MECHANISM / PROCESS</h2><div class="mechanism"><div class="name">${esc(mech.name||'Mechanism not named')}</div><div>${esc(mech.simpleExplanation||'')}</div><div class="small">Confidence: ${esc(mech.confidence||'')} ${mech.whatToVerify?` · Verify: ${esc(mech.whatToVerify)}`:''}</div></div></section>`:''}
 <section class="card"><h2>CURRENT SIGNALS</h2>${arr(r.currentSignals).map(x=>`<div class="item"><div class="title">${esc(x.signal)}</div><span class="tag">${esc(x.sourceType)}</span><span class="tag">${esc(x.trendStage)}</span><div class="signal">${esc(x.whyItMatters)}</div><div class="small">${esc(x.evidenceNote||'')}</div></div>`).join('')||'<div class="small">No current signals returned.</div>'}</section>
 <section class="card"><h2>HUMAN TENSION</h2>${arr(r.humanTensions).map(x=>`<div class="item">${esc(x)}</div>`).join('')||'<div class="small">No distinct tension returned.</div>'}</section>
 <section class="card"><h2>BIC CONNECTION</h2><div class="item"><b>${esc(r.bicConnection?.primary||'—')}</b> ${r.bicConnection?.secondary?`+ ${esc(r.bicConnection.secondary)}`:''}<div class="signal">${esc(r.bicConnection?.connection||'')}</div><span class="tag">${esc(r.bicConnection?.fit||'')}</span></div></section>
 <section class="card"><h2>VIRAL ANGLES</h2>${arr(r.viralAngles).map(x=>`<div class="item"><b>${esc(x.angle)}</b><div class="signal">${esc(x.reason)}</div><div class="small">Mechanism link: ${esc(x.mechanismLink||'')}</div></div>`).join('')||'<div class="small">No angles returned.</div>'}</section>
 <section class="card full"><h2>VISUAL VIDEO OPTIONS — TITLES ARE FINAL-LAYER OUTPUT</h2><p class="sectionNote">These are only useful when the concept can actually be shown. The system keeps the title at the end of the chain.</p>${arr(r.visualVideoOptions).map(x=>`<div class="item"><div class="title">${esc(x.title)}</div><div class="signal"><b>Concept:</b> ${esc(x.concept)}</div><div class="signal"><b>Show:</b> ${esc(x.visualTreatment)}</div><div class="small">Why different: ${esc(x.whyDifferent)}</div></div>`).join('')||'<div class="small">No visual options returned.</div>'}</section>
 <section class="card"><h2>EVIDENCE / RESEARCH FLAGS</h2>${arr(r.evidenceFlags).map(x=>`<div class="item">${esc(x)}</div>`).join('')||'<div class="small">No flags returned.</div>'}</section>
 <section class="card"><h2>OPTIONAL NEXT RESEARCH</h2><div class="item"><button class="btn" onclick="research('redo')">Research Again</button> <button class="btn green" onclick="research('deeper')">Go Deeper</button><div class="small" style="margin-top:8px">Same node, different research direction. This does not rebuild your map.</div></div></section>
 </div>`;
}
async function research(mode){if(!state.node||state.busy)return;setBusy(true,mode==='redo'?'Finding a genuinely different research pass…':mode==='deeper'?'Going deeper into the same node…':'Scanning the selected node…');try{const r=await fetch('/api/research',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({node:state.node,mode,previous:state.result})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Research failed');state.result=j.result;renderMain();clearNotice()}catch(e){notice(e.message,true)}finally{setBusy(false)}}
function openRadar(){
 state.node=null;state.result=null;$('crumb').textContent='Signal Radar';$('path').textContent='Signal Radar';
 const round=state.radarHistory.length+1;
 $('main').innerHTML=`<section class="hero"><div><div class="node-type">OPTIONAL DISCOVERY DOOR · V5.7 SIGNAL KEYWORD RADAR</div><h1>MEDIMANCH Signal Radar</h1><p>Radar is a dedicated <b>signal-keyword discovery engine</b> for MEDIMANCH. It is not a general health-news scanner. Each scan searches for specific emerging behaviours, named practices, wellness vocabulary, biohacks, routines, food/hydration habits and body-optimisation ideas that people are actually discussing or trying. The goal is to give you a large saved-keyword pool from which you choose your next research subject.</p></div></section><div class="card" style="margin-top:14px"><div class="radarHeader"><div><h2 style="margin:0">FAST DISCOVERY ROUND <span class="tag">#${round}</span></h2><div class="small">Sources: YouTube, Reddit public discovery and Google News RSS. This is signal discovery, not Google Trends search-volume measurement.</div></div><div class="radarControls"><button class="btn primary" onclick="runRadar()">FAST SCAN ROUND ${round}</button><button class="btn" onclick="resetRadar()">RESET RADAR HISTORY</button></div></div><div id="radarResults" class="radarGrid"><div class="empty" style="grid-column:1/-1"><b>Round ${round} is ready.</b><br>Each round intentionally changes the discovery lens. Previously surfaced signals will be excluded where possible.</div></div></div>`;
}
async function runRadar(){
 if(state.busy)return;
 const round=state.radarHistory.length+1;
 const seenKeywords=state.radarHistory.flatMap(x=>arr(x.items).map(i=>i.keyword)).filter(Boolean).slice(-180);
 const seenTitles=state.radarHistory.flatMap(x=>arr(x.rawTitles)).filter(Boolean).slice(-300);
 const recentItems=state.radarHistory.flatMap(x=>arr(x.items)).slice(-40);
 setBusy(true,`Fast Radar round ${round}: collecting fresh signals, then building the discovery cloud…`);
 try{
  const r=await fetch('/api/radar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({round,seenKeywords,seenTitles,recentItems})});
  const rawText=await r.text();
  let j; try{j=JSON.parse(rawText)}catch(err){throw new Error('Radar backend returned a non-JSON response. Please refresh once and try again.')}
  if(j.ok===false && j.error)throw new Error(j.error);
  const result=j.result||{};
  const historyEntry={round,mode:j.mode?.name||result.mode||`Round ${round}`,items:arr(result.items),rawTitles:arr(j.rawSignals).map(x=>x.title).filter(Boolean),generatedAt:j.generatedAt,queries:j.queries||[]};
  state.radarHistory.push(historyEntry);state.radarHistory=state.radarHistory.slice(-30);
  state.radar=result;localStorage.setItem('mm_radar_history_v56',JSON.stringify(state.radarHistory));
  renderRadar(result,j.generatedAt,j.mode,round,historyEntry);
 }catch(e){notice(e.message,true)}finally{setBusy(false)}
}
function resetRadar(){if(!confirm('Reset all Radar discovery history? This only resets Radar memory in this browser.'))return;state.radarHistory=[];state.radar=null;localStorage.removeItem('mm_radar_history_v56');openRadar();}
function renderRadar(r,generatedAt,mode,round,entry){
 const items=arr(r.items).filter(x=>x&&x.keyword);
 const modeName=mode?.name||r.mode||entry?.mode||'FRESH DISCOVERY';
 const modeDesc=mode?.desc||'A deliberately different discovery lens from previous scans.';
 const strong=[...items].sort((a,b)=>Number(b.signalStrength||0)-Number(a.signalStrength||0)).slice(0,24);
 const cloud=items.slice(0,100).map((x,i)=>{
   const score=Math.max(0,Math.min(100,Number(x.signalStrength||50)));
   const size=(12+score*0.075).toFixed(1);
   const weight=score>=80?950:score>=65?850:750;
   return `<button class="cloudChip" title="Signal strength ${score}/100 · ${esc(x.signalType||'SIGNAL')}" style="font-size:${size}px;font-weight:${weight}" onclick='startFromRadar(${JSON.stringify(x.keyword)})'>${esc(x.keyword)}<span class="score">${score}</span></button>`;
 }).join('');
 $('radarResults').innerHTML=`
 <div style="grid-column:1/-1">
   <span class="modePill">ROUND ${round}</span><span class="modePill">${esc(modeName)}</span>
   <span class="modePill">${items.length} DISCOVERY CHOICES</span>
   <div class="radarCount">Target: 75 · minimum useful board: 50 · maximum: 100 · specific signal keywords only; no generic filler. Each scan changes the discovery family.</div>
   <div class="small" style="margin-top:8px">${esc(modeDesc)} ${esc(generatedAt||'')}</div>
 </div>
 <div class="card full">
   <h2>MEDIMANCH SIGNAL KEYWORD CLOUD — CLICK ANY TERM</h2>
   <p class="sectionNote">This is your research keyword pool. Bigger text means stronger signal evidence in the scanned sources—not Google Trends volume. Look for memorable, specific terms such as a named behaviour, practice, ritual, technique, biohack or emerging wellness phrase. Click one to turn it into a full MEDIMANCH research map.</p>
   <div class="radarCloud">${cloud||'<div class="empty" style="width:100%">No candidates returned. Run another fresh round.</div>'}</div>
 </div>
 <div class="card full radarStrong">
   <h2>STRONGEST SIGNAL KEYWORDS — TOP ${strong.length}</h2>
   <p class="sectionNote">Only the strongest specific terms are expanded here. The cloud above is the main discovery board; these cards help you understand why a term is worth investigating.</p>
   <div class="radarGrid">
   ${strong.map((x,i)=>`<div class="radarItem"><div class="kw">${esc(x.keyword)}</div><span class="signalScore">Signal ${Number(x.signalStrength||0)}/100</span><span class="tag">${esc(x.signalType||'SIGNAL')}</span><span class="tag">${esc(x.novelty||'')}</span><div class="why"><b>Why now:</b> ${esc(x.whyNow||'')}</div><div class="why"><b>Human question:</b> ${esc(x.humanQuestion||'')}</div><div class="why"><b>Visual potential:</b> ${esc(x.visualPotential||'')}</div><div class="why"><b>Evidence:</b> ${esc(x.evidence||'')}</div><div class="sourceLine">Sources: ${esc((x.sourceMix||[]).join(' · '))} · Evidence count: ${esc(x.evidenceCount||'—')} · India: ${esc(x.indiaRelevance||'')}</div><div class="toolbar"><button class="btn primary" onclick='startFromRadar(${JSON.stringify(x.keyword)})'>EXPLORE THIS</button></div></div>`).join('')||'<div class="empty" style="grid-column:1/-1">No strong candidates returned.</div>'}
   </div>
 </div>
 <div class="card" style="grid-column:1/-1"><h2>RADAR DISCOVERY HISTORY</h2>${state.radarHistory.slice().reverse().map(h=>`<div class="item"><b>Round ${h.round} · ${esc(h.mode)}</b><div class="small">${arr(h.items).length} choices · ${esc(h.generatedAt||'')}</div></div>`).join('')}</div>
 <div class="card" style="grid-column:1/-1"><h2>RADAR CAVEATS</h2>${arr(r.caveats).map(x=>`<div class="item">${esc(x)}</div>`).join('')}</div>`;
}

function startFromRadar(keyword){$('keyword').value=keyword;buildMap()}
async function exploreIP(){if(!state.node||!state.result)return;setBusy(true,'Exploring this node as optional Content IP…');try{const r=await fetch('/api/ip-explore',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({node:state.node,research:state.result})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Content IP analysis failed');renderIP(j.result);clearNotice()}catch(e){notice(e.message,true)}finally{setBusy(false)}}
function renderIP(r){$('main').innerHTML+=`<section class="card full" style="margin-top:14px"><h2>OPTIONAL CONTENT IP HUB — SEPARATE FROM DISCOVERY</h2><div class="ipbox"><div class="title">${esc(r.hubName||'Content IP Hub')}</div><div class="signal">${esc(r.coreKnowledge||'')}</div><div class="toolbar">${arr(r.assetPaths).map(x=>`<span class="tag">${esc(x.type)} · ${esc(x.readiness)}</span>`).join('')}</div>${arr(r.assetPaths).map(x=>`<div class="ipAsset"><b>${esc(x.type)}</b> — ${esc(x.idea)}<div class="small">${esc(x.whyFit)}</div></div>`).join('')}<div class="item"><b>Premium pathway:</b> ${esc(r.premiumPathway||'')}</div><div class="item"><b>Why not premium:</b> ${esc(r.whyNotPremium||'')}</div><div class="item"><b>Before launch:</b> ${arr(r.validationBeforeLaunch).map(x=>esc(x)).join(' · ')}</div><div class="item"><b>Audience tests:</b> ${arr(r.audienceTestIdeas).map(x=>esc(x)).join(' · ')}</div><div class="toolbar"><button class="btn teal" onclick='saveIP(${JSON.stringify(r).replace(/'/g,"&#39;")})'>☆ SAVE CONTENT IP HUB</button></div></div></section>`}
function saveIP(r){if(!state.node)return;const item={node:state.node,research:state.result,hubName:r.hubName||'Content IP Hub',...r};if(!state.savedIP.some(x=>x.hubName===item.hubName&&JSON.stringify(x.node.path)===JSON.stringify(item.node.path))){state.savedIP.unshift(item);state.savedIP=state.savedIP.slice(0,100);persist();notice('Content IP Hub saved separately. It does not affect research discovery.')}}
async function health(){try{const r=await fetch('/api/health');const j=await r.json();$('health').textContent=`YouTube ${j.youtube?'✓':'—'} · LLM ${j.llm?'✓':'—'} · Radar ✓ · ${j.model}`}catch{$('health').textContent='backend offline'}}
renderSaved();health();openRadar();
</script>
</body>
</html>
