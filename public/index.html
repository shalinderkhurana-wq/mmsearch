<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEDIMANCH Research Navigator V4</title>
<style>
:root{--bg:#f4f1ea;--panel:#ffffff;--panel2:#faf8f3;--line:#ddd7ca;--text:#24231f;--muted:#6e6a61;--accent:#ffd34d;--accent2:#177a6b;--danger:#b44747}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:14px;background:#fffdf9;position:sticky;top:0;z-index:5}.logo{font-weight:900;letter-spacing:.08em}.badge{font-size:11px;color:#111;background:var(--accent);padding:4px 7px;border-radius:4px;font-weight:800}.search{display:flex;flex:1;max-width:620px;margin-left:10px}.search input{flex:1;background:#fff;border:1px solid var(--line);color:var(--text);padding:11px 13px;border-radius:7px 0 0 7px;outline:none}.search button{border:0;background:var(--accent);padding:0 18px;font-weight:900;border-radius:0 7px 7px 0}.radarbtn{border:1px solid #3d7569;background:#eef8f5;color:var(--accent2);padding:10px 13px;border-radius:7px;font-weight:900}.cloud{display:flex;flex-wrap:wrap;gap:9px;padding:16px;border:1px dashed var(--line);border-radius:9px;background:#faf8f3}.cloud button{border:1px solid #cfc8bb;background:#fff;color:var(--text);border-radius:99px;padding:7px 11px}.cloud button:hover{border-color:var(--accent);color:var(--accent)}.radargrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.radarcard{background:var(--panel);box-shadow:0 2px 8px rgba(40,35,25,.04);border:1px solid var(--line);border-radius:9px;padding:13px}.radarcard h3{margin:0 0 5px;font-size:16px}.score{float:right;color:var(--accent);font-weight:900}.radarclose{margin-bottom:12px}@media(max-width:700px){.radargrid{grid-template-columns:1fr}}.health{margin-left:auto;color:var(--muted);font-size:12px}.app{display:grid;grid-template-columns:280px minmax(0,1fr) 300px;min-height:calc(100vh - 68px)}.side,.right{background:#faf9f5;border-right:1px solid var(--line);padding:15px;overflow:auto}.right{border-right:0;border-left:1px solid var(--line)}.center{padding:18px 20px;overflow:auto}.side h3,.right h3{font-size:11px;letter-spacing:.12em;color:var(--muted);margin:2px 0 12px}.tree{font-size:13px}.tree button{width:100%;text-align:left;background:none;border:0;color:var(--text);padding:7px 7px;border-radius:6px}.tree button:hover{background:var(--panel2)}.tree .root{font-weight:900;color:var(--accent);font-size:15px}.tree .territory{font-weight:800}.tree .sub{padding-left:16px}.tree .cluster{padding-left:30px;color:#4e4a43}.children{margin-left:5px;border-left:1px solid #d7d0c3}.crumb{color:var(--muted);font-size:12px;margin-bottom:10px}.crumb b{color:var(--text)}.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.hero h1{font-size:27px;margin:0 0 5px}.hero p{margin:0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{background:#fff;color:var(--text);border:1px solid var(--line);padding:9px 11px;border-radius:7px}.btn.primary{background:var(--accent);color:#111;border-color:var(--accent);font-weight:900}.btn.green{border-color:#3d7569;color:var(--accent2)}.btn:disabled{opacity:.45;cursor:wait}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}.card{background:var(--panel);box-shadow:0 2px 8px rgba(40,35,25,.035);border:1px solid var(--line);border-radius:9px;padding:14px}.card h2{font-size:12px;letter-spacing:.08em;margin:0 0 11px;color:var(--muted)}.card h4{margin:8px 0 3px}.item{padding:9px 0;border-bottom:1px solid #eee9df}.item:last-child{border-bottom:0}.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 7px;font-size:10px;color:var(--muted);margin:2px}.title{font-size:15px;font-weight:800}.visual{color:#514d45;margin-top:4px}.empty{border:1px dashed var(--line);padding:30px;text-align:center;color:var(--muted);border-radius:9px;margin-top:18px}.saved{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:9px 0}.saved button{background:none;border:0;color:var(--text);text-align:left}.status{padding:9px 11px;border:1px solid var(--line);border-radius:7px;color:var(--muted);margin-top:12px}.status.err{color:var(--danger);border-color:#6c3a3a}.node-type{font-size:11px;color:var(--accent2);text-transform:uppercase;letter-spacing:.1em}.signal{font-size:12px;color:#cbd3db}.small{font-size:11px;color:var(--muted)}.pathbox{background:#faf8f3;border:1px solid var(--line);padding:10px;border-radius:7px;margin-bottom:12px}.save{width:100%;margin-top:10px}.raw{max-height:260px;overflow:auto;font-size:11px;color:#68635a}.raw div{padding:6px 0;border-bottom:1px solid #eee9df}.notice{background:#fff8dc;border:1px solid #e1c86a;color:#715a00;padding:10px;border-radius:7px;margin-top:12px}.hide{display:none!important}@media(max-width:1050px){.app{grid-template-columns:230px minmax(0,1fr)}.right{display:none}}@media(max-width:700px){.app{display:block}.side{display:none}.center{padding:14px}.grid{grid-template-columns:1fr}.health{display:none}.top{height:auto;min-height:68px;flex-wrap:wrap;padding:10px}.search{order:3;max-width:none;width:100%;margin:0}}
</style>
</head>
<body>
<header class="top"><div class="logo">MEDIMANCH</div><span class="badge">RESEARCH NAVIGATOR V7.1</span><div class="search"><input id="keyword" placeholder="Enter any flagship: Gut Health, PCOS, Kidney..."/><button onclick="buildMap()">EXPLORE</button></div><button class="radarbtn" onclick="openRadar()">🔥 SIGNAL RADAR</button><div class="health" id="health">checking…</div></header>
<div class="app">
<aside class="side"><h3>RESEARCH MAP</h3><div id="tree" class="tree"><div class="empty">Enter a flagship keyword to build the map.</div></div></aside>
<main class="center"><div id="crumb" class="crumb">Home</div><div id="main"><div class="empty">Choose a keyword. The map is built first; live research begins only after you select a node.</div></div></main>
<aside class="right"><h3>CURRENT PATH</h3><div id="path" class="pathbox">Home</div><h3>SAVED SHORTLIST</h3><div id="saved"></div></aside>
</div>
<script>
const state={map:null,node:null,result:null,raw:[],saved:JSON.parse(localStorage.getItem('mm_saved_v4')||'[]'),history:[],radar:[],radarLens:0,radarSeen:JSON.parse(localStorage.getItem('mm_radar_seen_v2')||'[]')};
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function saveLocal(){localStorage.setItem('mm_saved_v4',JSON.stringify(state.saved));renderSaved()}
function renderSaved(){ $('saved').innerHTML=state.saved.length?state.saved.map((x,i)=>`<div class="saved"><button onclick='selectSaved(${i})'>${esc(x.path.join(' › '))}</button><button onclick='removeSaved(${i})'>×</button></div>`).join(''):'<div class="small">Nothing saved yet.</div>' }
function selectSaved(i){const x=state.saved[i]; if(x) showNode(x.node)} function removeSaved(i){state.saved.splice(i,1);saveLocal()}
function nodePath(node){return node.path||[state.map?.keyword||'',node.label||'']}
function showNode(node){state.node=node;state.result=null;state.raw=[]; $('crumb').innerHTML=nodePath(node).map((x,i)=>i?` <span>›</span> <b>${esc(x)}</b>`:`<b>${esc(x)}</b>`).join(''); $('path').innerHTML=nodePath(node).map(esc).join(' › '); renderMain()}
function flattenTree(node, path, type){return {id:node.id,label:node.label,type,path:[...path,node.label],children:node.children||[]}}
function renderTree(){const m=state.map;if(!m)return;let html=`<button class="root" onclick='showNode(${JSON.stringify({id:'root',label:m.keyword,type:'flagship',path:[m.keyword],children:m.territories||[]})})'>⭐ ${esc(m.keyword)}</button>`;html+=`<div class="children">${(m.territories||[]).map(t=>renderTreeNode(t,[m.keyword],'territory')).join('')}</div>`;$('tree').innerHTML=html}
function renderTreeNode(n,parentPath,type){const obj={id:n.id,label:n.label,type,path:[...parentPath,n.label],children:n.children||[]};const has=(n.children||[]).length;return `<div><button class="${type}">${type==='territory'?'▸':'•'} <span onclick='showNode(${JSON.stringify(obj)})'>${esc(n.label)}</span></button>${has?`<div class="children">${n.children.map(c=>renderTreeNode(c,obj.path,type==='territory'?'sub':'cluster')).join('')}</div>`:''}</div>`}
async function buildMap(){const keyword=$('keyword').value.trim();if(!keyword)return;setBusy(true,'Building research map…');try{const r=await fetch('/api/map',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({keyword})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Map error');state.map=j.map;state.node={id:'root',label:j.map.keyword,type:'flagship',path:[j.map.keyword],children:j.map.territories||[]};localStorage.setItem('mm_map_v4_'+keyword.toLowerCase(),JSON.stringify(j.map));renderTree();showNode(state.node);if(j.mode==='fallback')notice('LLM map unavailable. Add OPENAI_API_KEY in Render to get the full ChatGPT-quality dynamic map.');else clearNotice()}catch(e){notice(e.message,true)}finally{setBusy(false)}}

function openRadar(){
  $('crumb').innerHTML='<b>Optional Signal Radar</b>';
  $('path').innerHTML='Signal Radar (separate from research map)';
  $('main').innerHTML=`<div class="hero"><div><div class="node-type">OPTIONAL DISCOVERY GATE</div><h1>MEDIMANCH Signal Radar</h1><p>Automatic discovery of strong, specific health/wellness signal keywords. You do not need to choose a lens. The Radar changes its research angle automatically and never changes the main Explore research engine.</p></div><div class="actions"><button class="btn" onclick="renderMain()">← Back to Research</button><button class="btn primary" onclick="runRadar(true)">REFRESH WITH NEW ANGLE</button></div></div><div class="status"><b>Purpose:</b> discover the next research keyword — named behaviours, practices, routines, biohacks, compounds, food/hydration habits, movement/recovery practices and emerging wellness vocabulary. Each refresh automatically moves to a different discovery lens and remembers previously surfaced terms.</div><div id="radarbody"><div class="empty">Starting automatic signal discovery…</div></div>`;
  renderRadarShell();
  setTimeout(()=>runRadar(true),40);
}
function renderRadarShell(){
  const el=$('radarbody'); if(!el) return;
  el.innerHTML=`<section class="card"><h2>AUTOMATIC SIGNAL DISCOVERY</h2><div class="small">The Radar chooses the discovery angle automatically. You only decide which keyword is interesting enough to explore. No lens selection is required.</div><div class="small" style="margin-top:10px">Previous signal keywords are remembered and excluded where possible. Use <b>REFRESH WITH NEW ANGLE</b> whenever you want a fresh research direction.</div></section><div class="empty">Collecting fresh MEDIMANCH signals…</div>`;
}
async function runRadar(autoNext=true,forcedLens=null){
  if(forcedLens!==null) state.radarLens=Number(forcedLens)||0;
  setBusy(true,'Scanning a fresh MEDIMANCH signal lens…');
  try{
    const r=await fetch('/api/radar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lensIndex:state.radarLens,seenKeywords:state.radarSeen})});
    const text=await r.text(); let j; try{j=JSON.parse(text)}catch{throw new Error('Radar returned a non-JSON response. Please retry.');}
    if(!r.ok) throw new Error(j.error||'Radar failed');
    state.radar=j.items||[];
    state.radarSeen=[...new Set([...state.radarSeen,...state.radar.map(x=>x.keyword).filter(Boolean)])].slice(-800);
    localStorage.setItem('mm_radar_seen_v2',JSON.stringify(state.radarSeen));
    renderRadarResults(j);
    if(j.ok===false) notice(j.error||'Radar unavailable.',true); else clearNotice();
    if(autoNext) state.radarLens=(state.radarLens+1)%8;
  }catch(e){notice(e.message,true)}finally{setBusy(false)}
}
function renderRadarResults(j){
  const items=(j.items||[]).filter(x=>x&&x.keyword);
  const cloud=items.map((x,i)=>`<button title="${esc(x.humanSignal||x.whyNow||'')}" onclick='radarExplore(${JSON.stringify(x.keyword)})' style="font-size:${Math.max(12,Math.min(26,12+Math.round((Number(x.strength)||50)/10)))}px">${esc(x.keyword)}</button>`).join('')||'<div class="empty" style="width:100%">No strong signal keywords returned. Try another lens.</div>';
  const cards=items.slice(0,30).map(x=>`<div class="radarcard"><span class="score">${esc(x.strength||'—')}/100</span><h3>${esc(x.keyword)}</h3><span class="tag">${esc(x.signalType||'signal')}</span><div class="signal"><b>Human signal:</b> ${esc(x.humanSignal||'—')}</div><div class="signal"><b>Why now:</b> ${esc(x.whyNow||'—')}</div><div class="signal"><b>MEDIMANCH fit:</b> ${esc(x.medimanchFit||'—')}</div><div class="small"><b>Sources:</b> ${esc((x.sourceMix||[]).join(', ')||'—')}</div><button class="btn primary" style="margin-top:8px" onclick='radarExplore(${JSON.stringify(x.keyword)})'>Explore This Keyword</button></div>`).join('');
  const lens=j.lens||'CURRENT LENS';
  $('radarbody').innerHTML=`<section class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2 style="margin:0">SIGNAL KEYWORD CLOUD — ${items.length} DISCOVERIES</h2><span class="tag">AUTO LENS · ${esc(lens)}</span></div><div class="small" style="margin:8px 0">These are candidate research keywords, not article headlines. Larger terms indicate stronger evidence in the scanned source mix, not Google Trends volume.</div><div class="cloud">${cloud}</div></section><section class="card" style="margin-top:14px"><h2>REFRESH / CHANGE ANGLE</h2><div class="actions"><button class="btn primary" onclick="runRadar(true)">REFRESH WITH NEW LENS</button><button class="btn" onclick="state.radarSeen=[];localStorage.removeItem('mm_radar_seen_v2');runRadar(false)">RESET SIGNAL HISTORY</button></div><div class="small" style="margin-top:8px">Current saved signal history: ${state.radarSeen.length} keywords. New scans exclude these where possible.</div></section><div class="radargrid">${cards||'<div class="empty">No expanded candidates.</div>'}</div>${(j.caveats||[]).length?`<div class="notice">${j.caveats.map(esc).join('<br>')}</div>`:''}`;
}
function radarExplore(keyword){$('keyword').value=keyword;buildMap()}

function setBusy(b,msg=''){document.querySelectorAll('button').forEach(x=>x.disabled=b);if(msg)notice(msg)}
function notice(msg,err=false){let x=document.querySelector('.notice');if(!x){x=document.createElement('div');x.className='notice';$('main').prepend(x)}x.className='notice'+(err?' status err':'');x.textContent=msg}function clearNotice(){document.querySelector('.notice')?.remove()}
function renderMain(){
  const n=state.node;if(!n)return;
  const canResearch=n.type!=='flagship';
  let body='';
  if(state.result) body=renderResult(state.result);
  else if(!canResearch) body=renderMapOverview(n);
  else body=`<div class="empty">This node is selected. Click <b>Research This Node</b> for current signals, human tension, BIC and visual opportunities.</div>`;
  $('main').innerHTML=`<div class="hero"><div><div class="node-type">${esc(n.type)}</div><h1>${esc(n.label)}</h1><p>${esc(n.description||'Selected research node. The map stays stable; live signals are refreshed separately.')}</p></div><div class="actions">${canResearch?`<button class="btn primary" onclick="research('research')">Research This Node</button><button class="btn green" onclick="research('deeper')">Go Deeper</button><button class="btn" onclick="research('redo')">Research Again</button>`:''}</div></div>${canResearch?`<button class="btn save" onclick="saveNode()">☆ Save This ${esc(n.type)}</button>`:''}${body}`;
}
function renderMapOverview(n){
  const ts=n.children||[];
  const cards=ts.map(t=>{const subs=t.children||[];const clusters=subs.reduce((a,s)=>a+(s.children||[]).length,0);return `<div class="card"><h2>${esc(t.label)}</h2><div class="signal">${esc(t.description||'Research territory')}</div><div class="small" style="margin-top:7px">${subs.length} sub-categories · ${clusters} visible clusters</div><div class="item"><b>Research directions</b>${subs.slice(0,8).map(s=>`<div class="small" style="padding:4px 0">• ${esc(s.label)}</div>`).join('')}</div><button class="btn primary" style="margin-top:8px" onclick='showNode(${JSON.stringify({id:t.id,label:t.label,type:'territory',path:[n.label,t.label],children:t.children||[],description:t.description||''})})'>Explore This Territory</button></div>`}).join('');
  return `<section class="card" style="margin-top:18px"><h2>RESEARCH UNIVERSE — ${ts.length} CONTENT TERRITORIES</h2><div class="small">This is the stable knowledge map. Nothing from Signal Radar is mixed into it. Choose any territory, sub-category or cluster to begin deep live research.</div></section><div class="grid">${cards}</div>`;
}

async function research(mode){if(!state.node)return;setBusy(true,mode==='redo'?'Re-researching this same node with different directions…':'Researching selected node…');try{const r=await fetch('/api/research',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({node:state.node,mode,previous:state.result})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Research failed');state.result=j.result;state.raw=j.rawSignals||[];state.history.push({node:state.node,result:j.result,mode});renderMain();clearNotice()}catch(e){notice(e.message,true)}finally{setBusy(false)}}
function list(arr,render){return (arr||[]).map(render).join('')||'<div class="small">No items returned.</div>'}
function renderResult(r){return `<div class="grid">
<section class="card"><h2>CURRENT SIGNALS</h2>${list(r.currentSignals,x=>`<div class="item"><div class="title">${esc(x.signal)}</div><span class="tag">${esc(x.sourceType)}</span><span class="tag">${esc(x.trendStage)}</span><div class="signal">${esc(x.whyItMatters)}</div></div>`)}</section>
<section class="card"><h2>HUMAN TENSION</h2>${list(r.humanTensions,x=>`<div class="item">${esc(x)}</div>`)}</section>
<section class="card"><h2>BIC CONNECTION</h2><div class="item"><b>${esc(r.bicConnection?.primary||'—')}</b> ${r.bicConnection?.secondary?`+ ${esc(r.bicConnection.secondary)}`:''}<div class="signal">${esc(r.bicConnection?.connection||'')}</div><span class="tag">${esc(r.bicConnection?.fit||'')}</span></div></section>
<section class="card"><h2>VIRAL ANGLES</h2>${list(r.viralAngles,x=>`<div class="item"><b>${esc(x.angle)}</b><div class="signal">${esc(x.reason)}</div></div>`)}</section>
<section class="card" style="grid-column:1/-1"><h2>VISUAL VIDEO OPTIONS — TITLES ONLY AT FINAL LAYER</h2>${list(r.visualVideoOptions,x=>`<div class="item"><div class="title">${esc(x.title)}</div><div class="visual"><b>Show:</b> ${esc(x.visualTreatment)}</div><div class="signal">${esc(x.concept)} — ${esc(x.whyDifferent)}</div></div>`)}</section>
<section class="card"><h2>EVIDENCE / RESEARCH FLAGS</h2>${list(r.evidenceFlags,x=>`<div class="item">${esc(x)}</div>`)}</section>
<section class="card"><h2>RESEARCH AGAIN</h2><div class="item">The same node can be rescanned without rebuilding the map. <button class="btn" onclick="research('redo')">Find Different Results</button></div></section>
</div>`}
async function health(){try{const r=await fetch('/api/health');const j=await r.json();$('health').textContent=`YouTube ${j.youtube?'✓':'—'} · LLM ${j.llm?'✓':'—'} · ${j.model}`}catch{$('health').textContent='backend offline'}}
renderSaved();health();
</script>
</body></html>
