<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MEDIMANCH Research Navigator V4</title>
<style>
:root{--bg:#0b0d10;--panel:#12161b;--panel2:#171c22;--line:#2a3139;--text:#f3f5f7;--muted:#9aa5b1;--accent:#ffd34d;--accent2:#8ee3cf;--danger:#ff8b8b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:14px;background:#0e1115;position:sticky;top:0;z-index:5}.logo{font-weight:900;letter-spacing:.08em}.badge{font-size:11px;color:#111;background:var(--accent);padding:4px 7px;border-radius:4px;font-weight:800}.search{display:flex;flex:1;max-width:620px;margin-left:10px}.search input{flex:1;background:#181d23;border:1px solid var(--line);color:#fff;padding:11px 13px;border-radius:7px 0 0 7px;outline:none}.search button{border:0;background:var(--accent);padding:0 18px;font-weight:900;border-radius:0 7px 7px 0}.radarbtn{border:1px solid #3d7569;background:#13211f;color:var(--accent2);padding:10px 13px;border-radius:7px;font-weight:900}.cloud{display:flex;flex-wrap:wrap;gap:9px;padding:16px;border:1px dashed var(--line);border-radius:9px;background:#0e1216}.cloud button{border:1px solid #36404a;background:#151b21;color:#fff;border-radius:99px;padding:7px 11px}.cloud button:hover{border-color:var(--accent);color:var(--accent)}.radargrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}.radarcard{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:13px}.radarcard h3{margin:0 0 5px;font-size:16px}.score{float:right;color:var(--accent);font-weight:900}.radarclose{margin-bottom:12px}@media(max-width:700px){.radargrid{grid-template-columns:1fr}}.health{margin-left:auto;color:var(--muted);font-size:12px}.app{display:grid;grid-template-columns:280px minmax(0,1fr) 300px;min-height:calc(100vh - 68px)}.side,.right{background:var(--panel);border-right:1px solid var(--line);padding:15px;overflow:auto}.right{border-right:0;border-left:1px solid var(--line)}.center{padding:18px 20px;overflow:auto}.side h3,.right h3{font-size:11px;letter-spacing:.12em;color:var(--muted);margin:2px 0 12px}.tree{font-size:13px}.tree button{width:100%;text-align:left;background:none;border:0;color:var(--text);padding:7px 7px;border-radius:6px}.tree button:hover{background:var(--panel2)}.tree .root{font-weight:900;color:var(--accent);font-size:15px}.tree .territory{font-weight:800}.tree .sub{padding-left:16px}.tree .cluster{padding-left:30px;color:#d7dde4}.children{margin-left:5px;border-left:1px solid #303740}.crumb{color:var(--muted);font-size:12px;margin-bottom:10px}.crumb b{color:#fff}.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.hero h1{font-size:27px;margin:0 0 5px}.hero p{margin:0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{background:#1b2128;color:#fff;border:1px solid var(--line);padding:9px 11px;border-radius:7px}.btn.primary{background:var(--accent);color:#111;border-color:var(--accent);font-weight:900}.btn.green{border-color:#3d7569;color:var(--accent2)}.btn:disabled{opacity:.45;cursor:wait}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px}.card h2{font-size:12px;letter-spacing:.08em;margin:0 0 11px;color:var(--muted)}.card h4{margin:8px 0 3px}.item{padding:9px 0;border-bottom:1px solid #252c33}.item:last-child{border-bottom:0}.tag{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:2px 7px;font-size:10px;color:var(--muted);margin:2px}.title{font-size:15px;font-weight:800}.visual{color:#cdd5dc;margin-top:4px}.empty{border:1px dashed var(--line);padding:30px;text-align:center;color:var(--muted);border-radius:9px;margin-top:18px}.saved{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line);padding:9px 0}.saved button{background:none;border:0;color:#fff;text-align:left}.status{padding:9px 11px;border:1px solid var(--line);border-radius:7px;color:var(--muted);margin-top:12px}.status.err{color:var(--danger);border-color:#6c3a3a}.node-type{font-size:11px;color:var(--accent2);text-transform:uppercase;letter-spacing:.1em}.signal{font-size:12px;color:#cbd3db}.small{font-size:11px;color:var(--muted)}.pathbox{background:#0e1216;border:1px solid var(--line);padding:10px;border-radius:7px;margin-bottom:12px}.save{width:100%;margin-top:10px}.raw{max-height:260px;overflow:auto;font-size:11px;color:#aeb8c2}.raw div{padding:6px 0;border-bottom:1px solid #232930}.notice{background:#211f15;border:1px solid #5e5125;color:#e9d88b;padding:10px;border-radius:7px;margin-top:12px}.hide{display:none!important}@media(max-width:1050px){.app{grid-template-columns:230px minmax(0,1fr)}.right{display:none}}@media(max-width:700px){.app{display:block}.side{display:none}.center{padding:14px}.grid{grid-template-columns:1fr}.health{display:none}.top{height:auto;min-height:68px;flex-wrap:wrap;padding:10px}.search{order:3;max-width:none;width:100%;margin:0}}
</style>
</head>
<body>
<header class="top"><div class="logo">MEDIMANCH</div><span class="badge">RESEARCH NAVIGATOR V4</span><div class="search"><input id="keyword" placeholder="Enter any flagship: Gut Health, PCOS, Kidney..."/><button onclick="buildMap()">EXPLORE</button></div><button class="radarbtn" onclick="openRadar()">🔥 SIGNAL RADAR</button><div class="health" id="health">checking…</div></header>
<div class="app">
<aside class="side"><h3>RESEARCH MAP</h3><div id="tree" class="tree"><div class="empty">Enter a flagship keyword to build the map.</div></div></aside>
<main class="center"><div id="crumb" class="crumb">Home</div><div id="main"><div class="empty">Choose a keyword. The map is built first; live research begins only after you select a node.</div></div></main>
<aside class="right"><h3>CURRENT PATH</h3><div id="path" class="pathbox">Home</div><h3>SAVED SHORTLIST</h3><div id="saved"></div></aside>
</div>
<script>
const state={map:null,node:null,result:null,raw:[],saved:JSON.parse(localStorage.getItem('mm_saved_v4')||'[]'),history:[],radar:[]};
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function saveLocal(){localStorage.setItem('mm_saved_v4',JSON.stringify(state.saved));renderSaved()}
function renderSaved(){ $('saved').innerHTML=state.saved.length?state.saved.map((x,i)=>`<div class="saved"><button onclick='selectSaved(${i})'>${esc(x.path.join(' › '))}</button><button onclick='removeSaved(${i})'>×</button></div>`).join(''):'<div class="small">Nothing saved yet.</div>' }
function selectSaved(i){const x=state.saved[i]; if(x) showNode(x.node)} function removeSaved(i){state.saved.splice(i,1);saveLocal()}
function nodePath(node){return node.path||[state.map?.keyword||'',node.label||'']}
function showNode(node){state.node=node;state.result=null;state.raw=[]; $('crumb').innerHTML=nodePath(node).map((x,i)=>i?` <span>›</span> <b>${esc(x)}</b>`:`<b>${esc(x)}</b>`).join(''); $('path').innerHTML=nodePath(node).map(esc).join(' › '); renderMain()}
function flattenTree(node, path, type){return {id:node.id,label:node.label,type,path:[...path,node.label],children:node.children||[]}}
function renderTree(){const m=state.map;if(!m)return;let html=`<button class="root" onclick='showNode(${JSON.stringify({id:'root',label:m.keyword,type:'flagship',path:[m.keyword],children:m.territories||[]})})'>⭐ ${esc(m.keyword)}</button>`;html+=`<div class="children">${(m.territories||[]).map(t=>renderTreeNode(t,[m.keyword],'territory')).join('')}</div>`;$('tree').innerHTML=html}
function renderTreeNode(n,parentPath,type){const obj={id:n.id,label:n.label,type,path:[...parentPath,n.label],children:n.children||[]};const has=(n.children||[]).length;return `<div><button class="${type}">${type==='territory'?'▸':'•'} <span onclick='showNode(${JSON.stringify(obj)})'>${esc(n.label)}</span></button>${has?`<div class="children">${n.children.map(c=>renderTreeNode(c,obj.path,type==='territory'?'sub':'cluster')).join('')}</div>`:''}</div>`}
async function buildMap(){const keyword=$('keyword').value.trim();if(!keyword)return;setBusy(true,'Building research map…');try{const r=await fetch('/api/map',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({keyword})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Map error');state.map=j.map;state.node={id:'root',label:j.map.keyword,type:'flagship',path:[j.map.keyword],children:j.map.territories||[]};localStorage.setItem('mm_map_v4_'+keyword.toLowerCase(),JSON.stringify(j.map));renderTree();showNode(state.node);if(j.mode==='fallback')notice('LLM map unavailable. Add OPENAI_API_KEY in Render to get the full ChatGPT-quality dynamic map.');else clearNotice()}catch(e){notice(e.message,true)}finally{setBusy(false)}}

function openRadar(){
  $('crumb').innerHTML='<b>Optional Signal Radar</b>';
  $('path').innerHTML='Signal Radar (separate from research map)';
  $('main').innerHTML=`<div class="hero"><div><div class="node-type">OPTIONAL DISCOVERY GATE</div><h1>MEDIMANCH Signal Radar</h1><p>Find specific emerging health/wellness signal keywords. This gate does not change your main research map or selected keyword workflow.</p></div><div class="actions"><button class="btn" onclick="renderMain()">← Back to Research</button><button class="btn primary" onclick="runRadar()">SCAN NEW SIGNALS</button></div></div><div class="status">Radar purpose: discover future research keywords such as named behaviours, practices, routines, biohacks, compounds, food/hydration habits, movement/recovery practices and emerging wellness vocabulary. It does not treat article headlines as keywords.</div><div id="radarbody"><div class="empty">Click <b>SCAN NEW SIGNALS</b> to build the optional discovery pool.</div></div>`;
}
async function runRadar(){
  setBusy(true,'Scanning optional Signal Radar…');
  try{
    const r=await fetch('/api/radar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({})});
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||'Radar failed');
    state.radar=j.items||[];
    renderRadarResults(j);
    if(j.ok===false) notice(j.error||'Radar unavailable.',true); else clearNotice();
  }catch(e){notice(e.message,true)}finally{setBusy(false)}
}
function renderRadarResults(j){
  const items=(j.items||[]).filter(x=>x&&x.keyword);
  const cloud=items.map((x,i)=>`<button title="${esc(x.whyNow||'')}" onclick='radarExplore(${JSON.stringify(x.keyword)})' style="font-size:${Math.max(12,Math.min(24,12+Math.round((Number(x.strength)||50)/12)))}px">${esc(x.keyword)}</button>`).join('')||'<div class="empty" style="width:100%">No defensible signal keywords returned. Radar did not convert generic headlines into fake keywords.</div>';
  const cards=items.slice(0,24).map(x=>`<div class="radarcard"><span class="score">${esc(x.strength||'—')}/100</span><h3>${esc(x.keyword)}</h3><span class="tag">${esc(x.signalType||'signal')}</span><div class="signal"><b>Why now:</b> ${esc(x.whyNow||'—')}</div><div class="signal"><b>MEDIMANCH fit:</b> ${esc(x.medimanchFit||'—')}</div><div class="small"><b>Start research:</b> ${esc(x.suggestedResearchStart||x.keyword)}</div><button class="btn primary" style="margin-top:8px" onclick='radarExplore(${JSON.stringify(x.keyword)})'>Explore This Keyword</button></div>`).join('');
  $('radarbody').innerHTML=`<section class="card"><h2>SIGNAL KEYWORD CLOUD — ${items.length} DISCOVERIES</h2><div class="small">This is an optional pool only. Clicking a keyword sends it through the original MEDIMANCH Explore workflow; Radar never rewrites that workflow.</div><div class="cloud">${cloud}</div></section><div class="radargrid">${cards||'<div class="empty">No strong candidates.</div>'}</div>${(j.caveats||[]).length?`<div class="notice">${j.caveats.map(esc).join('<br>')}</div>`:''}`;
}
function radarExplore(keyword){$('keyword').value=keyword;buildMap()}

function setBusy(b,msg=''){document.querySelectorAll('button').forEach(x=>x.disabled=b);if(msg)notice(msg)}
function notice(msg,err=false){let x=document.querySelector('.notice');if(!x){x=document.createElement('div');x.className='notice';$('main').prepend(x)}x.className='notice'+(err?' status err':'');x.textContent=msg}function clearNotice(){document.querySelector('.notice')?.remove()}
function renderMain(){const n=state.node;if(!n)return;const canResearch=n.type!=='flagship';let body='';if(state.result)body=renderResult(state.result);else body=`<div class="empty">${canResearch?'This node is selected. Live research is intentionally not automatic. Click <b>Research This Node</b> when you want current signals.':'This is the flagship map. Select a Territory, Sub-category or Cluster to research it.'}</div>`;$('main').innerHTML=`<div class="hero"><div><div class="node-type">${esc(n.type)}</div><h1>${esc(n.label)}</h1><p>${esc(n.description||'Selected research node. The map stays stable; signals are refreshed separately.')}</p></div><div class="actions">${canResearch?`<button class="btn primary" onclick="research('research')">Research This Node</button><button class="btn green" onclick="research('deeper')">Go Deeper</button><button class="btn" onclick="research('redo')">Research Again</button>`:''}</div></div>${canResearch?`<button class="btn save" onclick="saveNode()">☆ Save This ${esc(n.type)}</button>`:''}${body}`}
function saveNode(){if(!state.node)return;const k=JSON.stringify(state.node.path);if(!state.saved.some(x=>JSON.stringify(x.node.path)===k)){state.saved.unshift({node:state.node,path:state.node.path});state.saved=state.saved.slice(0,100);saveLocal();notice('Saved to shortlist.')}}
async function research(mode){if(!state.node)return;setBusy(true,mode==='redo'?'Re-researching this same node with different directions…':'Researching selected node…');try{const r=await fetch('/api/research',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({node:state.node,mode,previous:state.result})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Research failed');state.result=j.result;state.raw=j.rawSignals||[];state.history.push({node:state.node,result:j.result,mode});renderMain();clearNotice()}catch(e){notice(e.message,true)}finally{setBusy(false)}}
function list(arr,render){return (arr||[]).map(render).join('')||'<div class="small">No items returned.</div>'}
function renderResult(r){return `<div class="grid">
<section class="card"><h2>CURRENT SIGNALS</h2>${list(r.currentSignals,x=>`<div class="item"><div class="title">${esc(x.signal)}</div><span class="tag">${esc(x.sourceType)}</span><span class="tag">${esc(x.trendStage)}</span><div class="signal">${esc(x.whyItMatters)}</div></div>`)}</section>
<section class="card"><h2>HUMAN TENSION</h2>${list(r.humanTensions,x=>`<div class="item">${esc(x)}</div>`)}</section>
<section class="card"><h2>BIC CONNECTION</h2><div class="item"><b>${esc(r.bicConnection?.primary||'—')}</b> ${r.bicConnection?.secondary?`+ ${esc(r.bicConnection.secondary)}`:''}<div class="signal">${esc(r.bicConnection?.connection||'')}</div><span class="tag">${esc(r.bicConnection?.fit||'')}</span></div></section>
<section class="card"><h2>VIRAL ANGLES</h2>${list(r.viralAngles,x=>`<div class="item"><b>${esc(x.angle)}</b><div class="signal">${esc(x.reason)}</div></div>`)}</section>
<section class="card" style="grid-column:1/-1"><h2>VISUAL VIDEO OPTIONS — TITLES ONLY AT FINAL LAYER</h2>${list(r.visualVideoOptions,x=>`<div class="item"><div class="title">${esc(x.title)}</div><div class="visual"><b>Show:</b> ${esc(x.visualTreatment)}</div><div class="signal">${esc(x.concept)} — ${esc(x.whyDifferent)}</div></div>`)}</section>
<section class="card"><h2>EVIDENCE / RESEARCH FLAGS</h2>${list(r.evidenceFlags,x=>`<div class="item">${esc(x)}</div>`)}</section>
<section class="card"><h2>RESEARCH AGAIN</h2><div class="item">The same node can be rescanned without rebuilding the map. <button class="btn" onclick="research('redo')">Find Different Results</button></div></section>
</div>`}
async function health(){try{const r=await fetch('/api/health');const j=await r.json();$('health').textContent=`YouTube ${j.youtube?'✓':'—'} · LLM ${j.llm?'✓':'—'} · ${j.model}`}catch{$('health').textContent='backend offline'}}
renderSaved();health();
</script>
</body></html>
